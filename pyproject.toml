[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "katachi"
version = "0.1.0.dev0"
description = "See the shape your tree could become: bonsai species profiles and AI style previews."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Engramium" }]
keywords = ["bonsai", "stable-diffusion", "controlnet", "gradio", "plants"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Core deps are light so tests and the species tooling run without any ML stack.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Background removal (rembg / U2-Net). Weights are downloaded at runtime.
segment = ["rembg>=2.0.50"]
# Restyle generation (Stable Diffusion img2img + ControlNet). Weights downloaded at runtime.
restyle = [
    "torch>=2.2",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.28",
    "opencv-python-headless>=4.9",
]
# Gradio web UI.
ui = ["gradio>=4.36"]
# Everything needed to run the full app.
all = ["katachi[segment,restyle,ui]"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Engramium/katachi"
Issues = "https://github.com/Engramium/katachi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/katachi"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.format]
exclude = ["*.md"]
