[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "katachi"
version = "0.1.0.dev0"
description = "Bonsai tree profiles from a photo: species, care practices, and suitable styles."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Engramium" }]
keywords = ["bonsai", "plants", "species-identification", "gradio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Core deps are light so tests and the species tooling run without any ML stack.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Background removal (rembg / U2-Net). Weights are downloaded at runtime.
segment = ["rembg[cpu]>=2.0.50"]
# Gradio web UI.
ui = ["gradio>=4.36"]
# Everything needed to run the full app.
all = ["katachi[segment,ui]"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/mazharulrobeen/Katachi"
Issues = "https://github.com/mazharulrobeen/Katachi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/katachi"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.format]
exclude = ["*.md"]
